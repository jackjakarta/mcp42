name: Build Production Image

on:
  push:
    tags:
      - '*.*.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Set up Docker image tags
        id: vars
        run: |
          echo "TAG_VERSION=${{ github.event.inputs.tag || github.ref_name }}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load 1password secrets
        uses: 1password/load-secrets-action@v1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DOCKER_USERNAME: 'op://mcp42-app/github-secrets/DOCKER_USERNAME'
          DOCKER_PASSWORD: 'op://mcp42-app/github-secrets/DOCKER_PASSWORD'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to ghcr.io
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push docker image
        run: |
          docker build -t ghcr.io/${{ env.DOCKER_USERNAME }}/mcp42:${{ env.TAG_VERSION }} -t ghcr.io/${{ env.DOCKER_USERNAME }}/mcp42:latest . && \
          docker push ghcr.io/${{ env.DOCKER_USERNAME }}/mcp42:${{ env.TAG_VERSION }} && \
          docker push ghcr.io/${{ env.DOCKER_USERNAME }}/mcp42:latest
